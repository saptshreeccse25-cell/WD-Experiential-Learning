<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Tools Inc.</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.hero {
    height: 100vh;
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
    url('https://images.unsplash.com/photo-1503387762-592deb58ef4e');
    background-size: cover;
    background-position: center;
    color: white;
}

.card:hover {
    transform: scale(1.05);
    transition: 0.3s;
}
</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
<div class="container">
    <a class="navbar-brand" href="#">Precision Tools</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="http://responsiveindustries.com/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="http://linkedin.com/advice/0/how-can-you-develop-responsive-team-quickly">Team</a></li>
            <li class="nav-item"><a class="nav-link" href="https://www.responsiveindustries.com/contact-us/">Contact</a></li>
        </ul>
    </div>
</div>
</nav>

<!-- HERO -->
<section class="hero d-flex justify-content-center align-items-center text-center flex-column">
    <h1 class="display-4">Welcome to Precision Tools Inc.</h1>
    <p class="lead">High Quality Manufacturing Solutions</p>

    <button class="btn btn-warning mt-3" onclick="showMsg()">Explore</button>

    <a href="https://www.udemy.com/course/business-corporate-governance/" class="text-white mt-3">Explore More</a>
</section>

<!-- TEAM -->
<section class="container text-center py-5">
    <h2 class="mb-4">Meet Our Team</h2>

    <div class="row justify-content-center">

        <div class="col-md-3">
            <div class="card p-3 shadow">
                <img src="https://randomuser.me/api/portraits/men/32.jpg" class="card-img-top rounded-circle">
                <div class="card-body">
                    <h5>Amit</h5>
                    <p>CEO</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3 shadow">
                <img src="https://randomuser.me/api/portraits/women/44.jpg" class="card-img-top rounded-circle">
                <div class="card-body">
                    <h5>Neha</h5>
                    <p>Engineer</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3 shadow">
                <img src="https://randomuser.me/api/portraits/men/65.jpg" class="card-img-top rounded-circle">
                <div class="card-body">
                    <h5>Rahul</h5>
                    <p>Manager</p>
                </div>
            </div>
        </div>

    </div>
</section>

<!-- CONTACT -->
<section class="bg-light py-5">
<div class="container">
    <h2 class="text-center mb-4">Contact Us</h2>

    <form id="contactForm" class="mx-auto" style="max-width:500px;">

        <div class="mb-3">
            <input type="text" id="name" class="form-control" placeholder="Enter Name">
            <small class="text-danger" id="nameError"></small>
        </div>

        <div class="mb-3">
            <input type="email" id="email" class="form-control" placeholder="Enter Email">
            <small class="text-danger" id="emailError"></small>
        </div>

        <div class="mb-3">
            <input type="tel" id="phone" class="form-control" placeholder="Enter Phone Number">
            <small class="text-danger" id="phoneError"></small>
        </div>

        <div class="mb-3">
            <select id="subject" class="form-control">
                <option value="">Select Subject</option>
                <option>General Inquiry</option>
                <option>Service Request</option>
                <option>Feedback</option>
            </select>
            <small class="text-danger" id="subjectError"></small>
        </div>

        <div class="mb-3">
            <textarea id="message" class="form-control" placeholder="Enter Message"></textarea>
            <small class="text-danger" id="msgError"></small>
        </div>

        <button type="submit" class="btn btn-success w-100">Send Message</button>
    </form>
</div>
</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
function showMsg() {
    alert("Welcome to Precision Tools Inc.");
}

document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let subject = document.getElementById("subject").value;
    let message = document.getElementById("message").value.trim();

    let valid = true;

    // Clear errors
    document.getElementById("nameError").innerText = "";
    document.getElementById("emailError").innerText = "";
    document.getElementById("phoneError").innerText = "";
    document.getElementById("subjectError").innerText = "";
    document.getElementById("msgError").innerText = "";

    // Name
    if (name.length < 3) {
        document.getElementById("nameError").innerText = "Name must be at least 3 characters";
        valid = false;
    }

    // Email
    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    if (!email.match(emailPattern)) {
        document.getElementById("emailError").innerText = "Enter valid email";
        valid = false;
    }

    // Phone
    let phonePattern = /^[0-9]{10}$/;
    if (!phone.match(phonePattern)) {
        document.getElementById("phoneError").innerText = "Enter valid 10-digit phone number";
        valid = false;
    }

    // Subject
    if (subject === "") {
        document.getElementById("subjectError").innerText = "Please select a subject";
        valid = false;
    }

    // Message
    if (message.length < 10) {
        document.getElementById("msgError").innerText = "Message must be at least 10 characters";
        valid = false;
    }

    if (valid) {
        alert("Form Submitted Successfully!");
        this.reset();
    }
});
</script>

</body>
</html>
